<!DOCTYPE html>
<html lang="{{SLOT_LANG}}">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="color-scheme" content="dark"/>
<meta name="eastern-os-deliverable" content="reminder-day"/>
<title>{{SLOT_DOC_TITLE}}</title>
<style>

html, body { margin:0; padding:0; min-height:100%; background:#0c0a09; color:#f5f0e8;
  font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.eos-reminder-shell { max-width: 960px; margin: 0 auto; padding: 20px 16px 40px; }
.eos-reminder-top {
  display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom: 14px;
}
.eos-reminder-brand { display:inline-flex; align-items:center; gap:8px; }
.eos-reminder-brand img { height:22px; width:auto; display:block; }
.eos-reminder-brand-text {
  font-size:0.95rem; font-weight:700; letter-spacing:0.04em;
  background: linear-gradient(135deg, #8a6a1a 0%, #bf953f 16%, #fcf6ba 36%, #d4af37 50%, #fbf5b7 66%, #b38728 82%, #aa771c 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.eos-reminder-close {
  box-sizing:border-box; height:32px; border:1px solid rgba(242,202,80,0.6);
  background: linear-gradient(180deg, #f0d78c 0%, #d4af37 55%, #b8922a 100%);
  color:#14110a; font-weight:600; font-size:0.72rem; padding:0 10px; border-radius:8px;
  cursor:pointer; display:inline-flex; align-items:center;
}
body[data-embed="1"] .eos-reminder-close { display:none !important; }
.eos-reminder-day-only .poju-companion-frame { margin: 0; }
.eos-reminder-pack-note { color:#a8a29e; font-size:0.85rem; margin: 0 0 12px; }
.atmos-forecast__cal { display:flex; flex-direction:column; gap:6px; }
.atmos-forecast__weekdays, .atmos-forecast__row {
  display:grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap:6px;
}
.atmos-forecast__weekday {
  text-align:center; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:#a8a29e; padding:4px 0;
}
.atmos-forecast__cell {
  min-height: 72px; border:1px solid #3f3a32; border-radius:10px; background:#161311;
  padding:8px; text-align:left; color:#f5f0e8; cursor:default;
}
.atmos-forecast__cell.is-active { border-color: rgba(212,168,75,0.55); cursor:pointer; }
.atmos-forecast__cell.is-today { box-shadow: inset 0 0 0 1px rgba(231,200,122,0.55); }
.atmos-forecast__cell.is-past { opacity: 0.55; }
.atmos-forecast__cell.is-beyond { opacity: 0.35; }
.atmos-forecast__date { display:flex; align-items:baseline; gap:6px; }
.atmos-forecast__day-num { font-size:1.05rem; font-weight:600; color:#e7c87a; }
.atmos-forecast__month-tag { font-size:0.7rem; color:#a8a29e; }
.atmos-forecast__snippet { margin-top:6px; }
.atmos-forecast__snippet-text {
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  font-size:0.75rem; line-height:1.35; color:#d6d3d1;
}
.atmos-forecast__expand { display:inline-block; margin-top:4px; font-size:0.7rem; color:#e7c87a; }
.atmos-forecast__pending-row { margin-top:6px; }
.atmos-forecast__pending-label { font-size:0.7rem; color:#78716c; }
.poju-companion-sheet { display:none; }
.poju-companion-sheet.is-open {
  display:flex; position:fixed; inset:0; z-index:80; background:rgba(0,0,0,0.65);
  align-items:center; justify-content:center; padding:20px;
}
[data-gloss] { border-bottom:1px dotted rgba(242,202,80,0.45); cursor:help; }

/* Companion frame — peer chrome under delivery book; reuses atmos calendar cells. */

.poju-companion-frame {
  margin: 28px 12px 40px;
  padding: 20px 18px 16px;
  border: 1px solid rgba(212, 168, 75, 0.35);
  border-radius: 14px;
  background: linear-gradient(165deg, rgba(22, 19, 17, 0.96), rgba(12, 10, 9, 0.98));
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35);
}

.poju-companion-frame__header {
  text-align: center;
  margin-bottom: 16px;
}

.poju-companion-frame__title {
  margin: 0 0 6px;
  font-size: 1.15rem;
  font-weight: 600;
  color: #e7c87a;
  letter-spacing: 0.02em;
}

.poju-companion-frame__sub {
  margin: 0;
  font-size: 0.85rem;
  line-height: 1.45;
  color: #a8a29e;
}

.poju-companion-frame__error,
.poju-companion-frame__pending {
  margin: 12px 0;
  font-size: 0.9rem;
  color: #f5f0e8;
}

.poju-companion-frame__retry {
  margin-left: 10px;
  background: transparent;
  border: 1px solid rgba(212, 168, 75, 0.5);
  color: #e7c87a;
  border-radius: 6px;
  padding: 2px 10px;
  cursor: pointer;
}

.poju-companion-frame__mail {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 14px;
  padding-top: 10px;
  border-top: 1px solid rgba(63, 58, 50, 0.8);
}

.poju-companion-frame__toggle {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 0.82rem;
  color: #d6d3d1;
  cursor: pointer;
}

.poju-companion-frame__email {
  min-width: 200px;
  background: #161311;
  border: 1px solid #3f3a32;
  border-radius: 8px;
  color: #f5f0e8;
  padding: 6px 10px;
  font-size: 0.85rem;
}

.poju-companion-sheet {
  position: fixed;
  inset: 0;
  z-index: 80;
  background: rgba(0, 0, 0, 0.65);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.poju-companion-sheet__panel {
  width: min(560px, 100%);
  max-height: min(85vh, 720px);
  overflow: auto;
  background: #161311;
  border: 1px solid rgba(212, 168, 75, 0.4);
  border-radius: 14px;
  padding: 18px 20px 22px;
  color: #f5f0e8;
}

.poju-companion-sheet__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}

.poju-companion-sheet__head h3 {
  margin: 0;
  font-size: 1.05rem;
  color: #e7c87a;
}

.poju-companion-sheet__head button {
  background: transparent;
  border: 1px solid #3f3a32;
  color: #d6d3d1;
  border-radius: 8px;
  padding: 4px 12px;
  cursor: pointer;
}

.poju-companion-sheet__card {
  border: 1px solid #3f3a32;
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 12px;
}

.poju-companion-sheet__card h4 {
  margin: 0 0 10px;
  font-size: 1rem;
  color: #e7c87a;
}

.poju-companion-sheet__card h5 {
  margin: 10px 0 4px;
  font-size: 0.72rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: #a8a29e;
}

.poju-companion-sheet__evidence {
  margin-top: 1rem;
  border-top: 1px solid rgba(212, 168, 75, 0.25);
  padding-top: 0.75rem;
}

.poju-companion-sheet__evidence summary {
  cursor: pointer;
  font-size: 0.8rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: #a8a29e;
}

.poju-companion-sheet__evidence-body {
  margin-top: 0.5rem;
  font-size: 0.95rem;
  line-height: 1.55;
  color: #d6d3d1;
}

.poju-companion-sheet__card p {
  margin: 0;
  white-space: pre-wrap;
  line-height: 1.5;
  font-size: 0.92rem;
}

/* Term marks — golden soft word + dotted underline; detail plain in hover/click pop */

.term-mark {
  display: inline;
  position: relative;
}

.term-mark__word,
.term-mark__info,
.term-mark__paren {
  white-space: normal;
}

.term-mark__word {
  font-weight: 500;
}

.term-mark__word--interactive {
  border-bottom: 1px dotted currentColor;
  border-bottom-color: color-mix(in srgb, currentColor 45%, transparent);
  cursor: help;
  /* Keep selectable so gold soft labels copy with surrounding evidence/body prose */
  user-select: text;
  -webkit-user-select: text;
}

/* Evidence layer: [软译] + dashed underline so adjacent gold marks stay separable */
.term-mark--bracket .term-mark__word--interactive,
.term-mark__word--bracket.term-mark__word--interactive {
  border-bottom-style: dashed;
  letter-spacing: 0.01em;
}

.term-mark--bracket + .term-mark--bracket {
  margin-left: 0.15em;
}

.term-mark__word--interactive:hover,
.term-mark__word--interactive:focus-visible {
  border-bottom-color: currentColor;
}

.term-mark__paren {
  display: inline;
  margin: 0;
  padding: 0;
  border: none;
  background: none;
  font: inherit;
  font-weight: 450;
  line-height: inherit;
  cursor: help;
  vertical-align: baseline;
  color: inherit;
}

.term-mark--neutral .term-mark__word,
.term-mark--neutral .term-mark__info,
.term-mark--neutral .term-mark__paren {
  color: #c5a880;
}

.term-mark--favorable .term-mark__word,
.term-mark--favorable .term-mark__info,
.term-mark--favorable .term-mark__paren {
  color: #7fc4a8;
}

.term-mark--caution .term-mark__word,
.term-mark--caution .term-mark__info,
.term-mark--caution .term-mark__paren {
  color: #e07a5f;
}

.term-mark--neutral .glossary-pop__title {
  color: #c5a880;
}

.term-mark--favorable .glossary-pop__title {
  color: #7fc4a8;
}

.term-mark--caution .glossary-pop__title {
  color: #e07a5f;
}

/* legacy default gold when no polarity class */
.term-mark:not([class*="term-mark--"]) .term-mark__word,
.term-mark:not([class*="term-mark--"]) .term-mark__info,
.term-mark:not([class*="term-mark--"]) .term-mark__paren {
  color: #d4af37;
}

.term-mark--hover {
  cursor: help;
}

/* Matrix/zodiac hover mode: same dotted underline language */
.term-mark--hover .term-mark__word {
  border-bottom: 1px dotted currentColor;
  border-bottom-color: color-mix(in srgb, currentColor 45%, transparent);
}

.term-mark--hover .term-mark__word--interactive:hover,
.term-mark--hover .term-mark__word--interactive:focus-visible,
.term-mark--hover:hover .term-mark__word,
.term-mark--hover:focus-within .term-mark__word {
  border-bottom-color: currentColor;
}

/* Legacy .term-mark__info ([···] opener) kept for old CSS refs; TermMark uses soft word + underline */
.term-mark__info {
  display: inline;
  margin-left: 2px;
  padding: 0 1px;
  border: none;
  background: none;
  font-size: 0.82em;
  line-height: 1;
  cursor: pointer;
  vertical-align: baseline;
  font-family: inherit;
}

.term-mark__info--inline {
  pointer-events: none;
}

.term-hint {
  margin: 0 0 12px;
  padding: 10px 12px;
  border-radius: 10px;
  background: rgba(212, 175, 55, 0.08);
  border: 0.5px solid rgba(212, 175, 55, 0.25);
  font-size: 13px;
  color: #cbd0e0;
}

.term-hint--bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  margin: 0;
  padding: 0.75rem 1rem;
  border-radius: 0.625rem;
  background: rgba(212, 175, 55, 0.1);
  border: 1px solid rgba(212, 175, 55, 0.28);
}

.term-hint__body {
  margin: 0;
  flex: 1;
  line-height: 1.55;
}

.term-hint__dismiss {
  flex-shrink: 0;
  margin: 0;
  padding: 0.25rem 0.75rem;
  border: 1px solid rgba(212, 175, 55, 0.45);
  border-radius: 999px;
  background: rgba(212, 175, 55, 0.12);
  color: #d4af37;
  cursor: pointer;
  font: inherit;
  font-size: 0.8125rem;
  white-space: nowrap;
  text-decoration: none;
}

/* Legacy glossary popover (shared with term marks) */
.glossary-mark {
  color: #d4af37;
  font-weight: 500;
  cursor: help;
  position: relative;
}

.glossary-pop {
  position: absolute;
  left: 0;
  top: 1.6em;
  z-index: 1000;
  box-sizing: border-box;
  width: min(280px, 78vw);
  max-width: min(280px, 78vw);
  padding: 12px 14px;
  border-radius: 14px;
  background: rgba(20, 18, 32, 0.92);
  box-shadow:
    inset 0 0 0 0.5px rgba(255, 255, 255, 0.08),
    0 12px 40px rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(20px);
  font-size: 13px;
  line-height: 1.5;
  display: grid;
  gap: 4px;
  white-space: normal;
  overflow-wrap: break-word;
  word-break: break-word;
  pointer-events: auto;
}

/* Portaled popover — escapes modal overflow clipping */
.glossary-pop--portal {
  position: fixed;
  top: auto;
  left: auto;
}

.glossary-pop--portal.glossary-pop--above {
  transform: translateY(-100%);
}

.glossary-pop__title {
  color: #d4af37;
  font-weight: 600;
  white-space: normal;
  overflow-wrap: break-word;
}

.glossary-pop__body {
  color: #cbd0e0;
  white-space: normal;
  overflow-wrap: break-word;
}

.streaming-analysis-panel .glossary-pop {
  top: auto;
  bottom: 1.6em;
}

.term-mark .glossary-pop {
  top: 1.6em;
}

.streaming-analysis-panel .term-mark .glossary-pop {
  top: auto;
  bottom: 1.6em;
}

</style>
</head>

    </span>
    <button type="button" class="eos-reminder-close" id="eos-reminder-close" aria-label="{{SLOT_CLOSE_LABEL}}">{{SLOT_CLOSE_LABEL}}</button>
  </div>
  <section class="poju-companion-frame" aria-label="{{SLOT_FRAME_ARIA}}">
    <header class="poju-companion-frame__header">
      <h2 class="poju-companion-frame__title">{{SLOT_TITLE}}</h2>
      <p class="poju-companion-frame__sub">{{SLOT_SUBTITLE}}</p>
    </header>
    <article class="poju-companion-sheet__card">
{{SLOT_CARD_BODY}}
    </article>
  </section>
</div>
<script>

(function(){
  var closeBtn = document.getElementById("eos-reminder-close");
  if (closeBtn) closeBtn.addEventListener("click", function(){
    try { if (window.parent && window.parent !== window) { window.parent.postMessage({ type: "eastern-os-reminder-close" }, "*"); return; } } catch (e) {}
    try { window.close(); } catch (e2) {}
  });
  var sheet = document.getElementById("eos-reminder-sheet");
  var sheetBody = document.getElementById("eos-reminder-sheet-body");
  var sheetTitle = document.getElementById("eos-reminder-sheet-title");
  var days = {};
  try { days = JSON.parse(document.getElementById("eos-reminder-days-json").textContent || "{}"); } catch (e) { days = {}; }
  function openDay(key){
    var d = days[key]; if (!d || !sheet || !sheetBody) return;
    if (sheetTitle) sheetTitle.textContent = d.title || key;
    sheetBody.innerHTML = d.html || "";
    sheet.classList.add("is-open");
  }
  function closeSheet(){ if (sheet) sheet.classList.remove("is-open"); }
  document.querySelectorAll("[data-day-key]").forEach(function(btn){
    btn.addEventListener("click", function(){ var k = btn.getAttribute("data-day-key"); if (k) openDay(k); });
  });
  var sheetClose = document.getElementById("eos-reminder-sheet-close");
  if (sheetClose) sheetClose.addEventListener("click", closeSheet);
  if (sheet) sheet.addEventListener("click", function(ev){ if (ev.target === sheet) closeSheet(); });
  var auto = document.body.getAttribute("data-auto-day");
  if (auto) openDay(auto);
})();

</script>
