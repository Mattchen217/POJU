<!DOCTYPE html>
<html lang="{{SLOT_LANG}}">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="color-scheme" content="dark"/>
<meta name="eastern-os-deliverable" content="decision-report"/>
<title>{{SLOT_DOC_TITLE}}</title>
<style>

html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0B0815; }
.delivery-book-stage { height:100%; min-height:0; }
.delivery-book-stage__header-logo-link { display:inline-flex; align-items:center; gap:8px; text-decoration:none; }
.delivery-book-stage__header-logo-img { height:22px; width:auto; display:block; }
.delivery-book-stage__header-logo-text {
  font-size:0.95rem; font-weight:700; letter-spacing:0.04em;
  background: linear-gradient(135deg, #8a6a1a 0%, #bf953f 16%, #fcf6ba 36%, #d4af37 50%, #fbf5b7 66%, #b38728 82%, #aa771c 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.delivery-book-stage__icon-btn img { width:18px; height:18px; display:block; filter: invert(86%) sepia(18%) saturate(600%) hue-rotate(6deg) brightness(95%); }
.eos-decision-close {
  box-sizing:border-box; height:32px; border:1px solid rgba(242,202,80,0.6);
  background: linear-gradient(180deg, #f0d78c 0%, #d4af37 55%, #b8922a 100%);
  color:#14110a; font-weight:600; font-size:0.72rem; padding:0 10px; border-radius:8px;
  box-shadow:0 1px 6px rgba(212,175,55,0.22); line-height:1; display:inline-flex; align-items:center; justify-content:center; cursor:pointer;
}
.eos-decision-close:hover { background: linear-gradient(180deg, #f7e4a8 0%, #e0c04a 55%, #c9a227 100%); }
body[data-embed="1"] .eos-decision-close { display:none !important; }
[data-gloss] { border-bottom:1px dotted rgba(242,202,80,0.45); cursor:help; }
.eos-gloss-pop {
  position:fixed; z-index:10000; max-width:280px; padding:10px 12px; border-radius:10px;
  background:#111827; border:1px solid rgba(242,202,80,0.35); color:#e5e7eb; font-size:12px; line-height:1.45;
  box-shadow:0 12px 32px rgba(0,0,0,0.45); pointer-events:none;
}
.delivery-book-stage__pane { display:none; }
.delivery-book-stage__pane.is-active { display:block; overflow:auto; }
.delivery-book-stage__toc-label { display:block; font-size:13px; line-height:1.35; }

/* Phase-4 dual-pane delivery book — Eastern OS gold/black (workspace tokens) */

/* Shared reader frame (SoT 15): baseline portrait + phase-4 delivery + vault sheet. */
:root {
  --ws-doc-reader-w: min(960px, 94vw);
  --ws-doc-reader-h: min(640px, 76vh);
  /* Baseline modal alone — taller so 5 TOC titles + content breathe */
  --ws-baseline-reader-h: min(780px, 88vh);
  /* Left title/TOC rail — keep compact so right content gets the width */
  --ws-doc-toc-w: minmax(188px, 228px);
}

/* Chat documentSlot host — baseline portrait independent of message bubbles */
.pchat__doc-reader {
  width: 100%;
  flex: 0 0 auto;
  display: flex;
  justify-content: center;
  align-items: stretch;
  min-height: 0;
  box-sizing: border-box;
}

.pchat__doc-reader > .delivery-book-stage {
  --delivery-inset: 0;
  width: var(--ws-doc-reader-w, min(960px, 94vw));
  max-width: 100%;
  height: var(--ws-doc-reader-h, min(640px, 76vh));
  max-height: var(--ws-doc-reader-h, min(640px, 76vh));
  min-height: 0;
  flex: 0 1 auto;
  padding: 0;
}

.delivery-book-stage {
  /* Equal gutters on all sides — larger inset = smaller card */
  --delivery-inset: 64px;
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  max-width: none;
  margin: 0;
  min-height: 0;
  padding: var(--delivery-inset);
  box-sizing: border-box;
  animation: delivery-book-stage-in 480ms var(--ease-smooth, ease) both;
}

@keyframes delivery-book-stage-in {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (prefers-reduced-motion: reduce) {
  .delivery-book-stage {
    animation: none;
  }
}

/*
 * Report + dock as one shell — attached, shared radius.
 *
 * CRITICAL: do NOT put overflow:hidden on this shell while any descendant
 * uses backdrop-filter. That combo creates a Backdrop Root and Chromium
 * paints a darkened veil across the TOP of the rounded clip — which is
 * exactly the logo header strip. Clip only the middle card instead.
 */
.delivery-book-stage__shell {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
  display: flex;
  flex-direction: column;
  border-radius: 16px;
  overflow: visible;
  border: 1px solid transparent;
  background: #111827;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
  transition:
    border-color 160ms ease,
    box-shadow 160ms ease;
}

.delivery-book-stage__shell:hover,
.delivery-book-stage__shell:focus-within {
  border-color: rgba(242, 202, 80, 0.5);
  box-shadow:
    0 8px 32px rgba(0, 0, 0, 0.35),
    0 0 0 1px rgba(242, 202, 80, 0.2);
}

.delivery-book-stage__card {
  position: relative;
  z-index: 1;
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
  display: flex;
  flex-direction: column;
  border-radius: 0;
  overflow: hidden;
  background: #111827;
  border: none;
  box-shadow: none;
  /* Isolate blur descendants so they cannot darken header/footer chrome */
  isolation: isolate;
}

.delivery-book-stage__boot {
  position: relative;
  flex: 1;
  min-height: 280px;
}

.delivery-book-stage__boot-panes {
  display: grid;
  grid-template-columns: var(--ws-doc-toc-w, minmax(188px, 228px)) 1fr;
  height: 100%;
  min-height: 280px;
}

.delivery-book-stage__boot-left {
  background: rgba(11, 15, 18, 0.95);
  border-right: 1px solid rgba(255, 255, 255, 0.06);
}

.delivery-book-stage__boot-right {
  background: rgba(28, 32, 36, 0.55);
}

.delivery-book-stage__boot-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  padding: 24px;
  text-align: center;
  pointer-events: none;
}

.delivery-book-stage__panes {
  display: grid;
  grid-template-columns: var(--ws-doc-toc-w, minmax(188px, 228px)) 1fr;
  flex: 1;
  min-height: 0;
}

.delivery-book-stage__left {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 16px 14px 12px;
  min-height: 0;
  overflow: hidden;
  /* Solid — no backdrop-filter (avoids darkening chrome via Backdrop Root) */
  background: #0c1219;
  border-right: 1px solid rgba(255, 255, 255, 0.08);
}

.delivery-book-stage__logo-link {
  display: none;
}

.delivery-book-stage__logo {
  display: none;
}

.delivery-book-stage__header-logo-link {
  display: inline-flex;
  align-items: flex-end;
  justify-content: center;
  gap: 0.375rem;
  text-decoration: none;
  color: inherit;
  line-height: 0;
}

/* Legacy single-file mark (kept for offline HTML packs) */
.delivery-book-stage__header-logo {
  display: block;
  height: 16px;
  width: auto;
  object-fit: contain;
  opacity: 1;
}

.delivery-book-stage__product-title {
  margin: 0 0 4px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-family: var(--font-primary, Inter, sans-serif);
  font-size: clamp(18px, 1.7vw, 24px);
  font-weight: 700;
  line-height: 1.15;
  letter-spacing: -0.02em;
  color: transparent;
  background: linear-gradient(
    135deg,
    #8a6a1a 0%,
    #bf953f 16%,
    #fcf6ba 36%,
    #d4af37 50%,
    #fbf5b7 66%,
    #b38728 82%,
    #aa771c 100%
  );
  background-size: 140% 140%;
  background-position: 30% 40%;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.24));
}

.delivery-book-stage__product-title span {
  display: block;
}

.delivery-book-stage__product-title-line3 {
  font-size: 0.88em;
  letter-spacing: -0.03em;
  white-space: normal;
}

.delivery-book-stage__gold-rule {
  display: none;
}

.delivery-book-stage__question {
  display: none;
}

.delivery-book-stage__meta-card {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 10px 12px;
  border-radius: 4px;
  background: #111827;
  border: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
}

.delivery-book-stage__meta-question {
  margin: 0;
  font-size: 13px;
  line-height: 1.4;
  font-weight: 500;
  color: #ffffff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.delivery-book-stage__meta-row {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.delivery-book-stage__meta-row--pair {
  gap: 12px;
}

.delivery-book-stage__meta-cell {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  flex: 1 1 0;
}

.delivery-book-stage__meta-row .material-symbols-outlined,
.delivery-book-stage__meta-cell .material-symbols-outlined {
  flex: 0 0 auto;
  font-size: 15px;
  line-height: 1;
  color: rgba(255, 255, 255, 0.72);
}

.delivery-book-stage__meta-text {
  min-width: 0;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  color: #ffffff;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.delivery-book-stage__meta-text--mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  letter-spacing: 0.02em;
}

/* Legacy identity styles kept for boot compatibility */
.delivery-book-stage__identity-card {
  display: none;
}

@keyframes delivery-book-stage-pulse {
  0%,
  100% {
    opacity: 0.55;
  }
  50% {
    opacity: 1;
  }
}

.delivery-book-stage__toc {
  /* Prefer fitting all 8 TOC rows without a vestigial scrollbar */
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  margin-top: 4px;
  overflow: hidden;
}

.delivery-book-stage__toc-scroll {
  flex: 1 1 auto;
  min-height: 0;
  height: 100%;
}

.delivery-book-stage__toc-head {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 0 0 auto;
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #6b7280;
  margin-bottom: 8px;
}

.delivery-book-stage__toc-head-rule {
  display: inline-block;
  width: 12px;
  height: 1px;
  background: #6b7280;
}

.delivery-book-stage__toc-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.delivery-book-stage__toc-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  width: 100%;
  /* Compact rows so 5 page titles fit the shorter reader frame */
  padding: 6px 8px;
  border: 0;
  border-left: 2px solid transparent;
  border-radius: 4px;
  background: transparent;
  color: #9ca3af;
  text-align: left;
  cursor: pointer;
  position: relative;
  transition: background 200ms ease, color 200ms ease, border-color 200ms ease, box-shadow 200ms ease;
}

.delivery-book-stage__toc-item:hover:not(:disabled) {
  color: #fff;
  background: rgba(31, 41, 55, 0.5);
}

.delivery-book-stage__toc-item--ready {
  color: #ffffff;
}

.delivery-book-stage__toc-item--ready .delivery-book-stage__toc-num {
  color: #ffffff;
}

.delivery-book-stage__toc-item--ready:hover:not(:disabled) {
  color: #ffffff;
}

.delivery-book-stage__toc-item--active {
  color: #fde047;
  font-weight: 500;
  background: rgba(253, 224, 71, 0.06);
  border-left-color: #fde047;
  box-shadow: 0 0 10px rgba(253, 224, 71, 0.1);
}

.delivery-book-stage__toc-item--pending {
  opacity: 0.35;
  cursor: default;
  color: #9ca3af;
}

.delivery-book-stage__toc-num {
  flex: 0 0 auto;
  width: 1.1em;
  margin-top: 2px;
  font-size: 11px;
  font-family: var(--pj-font-mono, ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace);
  font-variant-numeric: tabular-nums;
  color: #4b5563;
}

.delivery-book-stage__toc-item--active .delivery-book-stage__toc-num {
  color: #fde047;
}

.delivery-book-stage__toc-text {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 3px;
  font-family: var(--pj-font-sans, var(--font-primary));
}

.delivery-book-stage__toc-tag {
  display: block;
  font-size: 13px;
  line-height: 1.35;
  font-weight: 600;
}

.delivery-book-stage__toc-title {
  display: block;
  font-size: 13px;
  line-height: 1.4;
  font-weight: 500;
  color: inherit;
  word-break: break-word;
}

.delivery-book-stage__toc-item--pending .delivery-book-stage__toc-title,
.delivery-book-stage__toc-item--pending .delivery-book-stage__toc-sub {
  opacity: 0.85;
}

.delivery-book-stage__toc-sub {
  display: flex;
  align-items: flex-start;
  gap: 4px;
  font-size: 11px;
  line-height: 1.4;
  color: #9ca3af;
}

.delivery-book-stage__toc-item--active .delivery-book-stage__toc-sub {
  color: rgba(253, 224, 71, 0.75);
}

.delivery-book-stage__toc-item--ready .delivery-book-stage__toc-sub {
  color: #9ca3af;
}

.delivery-book-stage__toc-sub-mark {
  flex: 0 0 auto;
  opacity: 0.7;
  line-height: 1.4;
}

.delivery-book-stage__toc-sub-copy {
  flex: 1 1 auto;
  min-width: 0;
  word-break: break-word;
}

/* Legacy single-line label (kept for any leftover markup) */
.delivery-book-stage__toc-label {
  font-size: 13px;
  line-height: 1.35;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.delivery-book-stage__left-foot {
  /* Keep compact (do not steal TOC height); larger type scrolls inside */
  flex: 0 0 auto;
  margin-top: auto;
  padding-top: 8px;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  max-height: 72px;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  font-size: 12.5px;
  line-height: 1.5;
  color: #9ca3af;
}

.delivery-book-stage__left-foot-scroll {
  flex: 1 1 auto;
  min-height: 0;
  height: 100%;
}

.delivery-book-stage__left-foot-inner {
  display: flex;
  flex-direction: column;
  gap: 0;
  padding-right: 2px;
}

/* Icon | copy — body wraps flush with text after the label, never under the icon */
.delivery-book-stage__left-foot-row {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  margin: 0 0 8px;
}

.delivery-book-stage__left-foot-row:last-child {
  margin-bottom: 0;
}

.delivery-book-stage__left-foot-icon {
  flex: 0 0 auto;
  font-size: 15px !important;
  line-height: 1.5;
  width: 15px;
  height: 1.5em;
  color: var(--ws-gold, #f2ca50);
  font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 20;
}

.delivery-book-stage__left-foot-copy {
  flex: 1 1 auto;
  min-width: 0;
  margin: 0;
  color: #9ca3af;
}

.delivery-book-stage__left-foot-label {
  float: left;
  font-weight: 600;
  color: #9ca3af;
}

.delivery-book-stage__left-foot-body {
  display: block;
  overflow: hidden; /* BFC: wrap beside/below label, not under icon */
  color: #9ca3af;
}

.delivery-book-stage__left-foot-row::after {
  content: "";
  display: table;
  clear: both;
}

.delivery-book-stage__right {
  position: relative;
  display: flex;
  flex-direction: column;
  min-height: 0;
  padding: 0;
  overflow: hidden;
  background: transparent;
}

/* Phase-4 start: left chrome is up; spinner + tips sit in the right pane. */
.delivery-book-stage__right-wait {
  flex: 1 1 auto;
  min-height: 280px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  padding: 40px 36px;
  text-align: center;
}

.delivery-book-stage__right-scroll {
  flex: 1 1 auto;
  min-height: 0;
  height: 100%;
}

.delivery-book-stage__right-scroll > .workspace-scroll__viewport {
  padding: 40px 40px 32px 36px;
}

.delivery-book-stage__page-chrome {
  margin: 0 auto 36px;
  width: 100%;
  max-width: min(720px, 100%);
}

.delivery-book-stage__page-tag {
  margin: 0 0 8px;
  font-family: var(--pj-font-sans);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.06em;
  color: #f2ca50;
}

.delivery-book-stage__page-title {
  margin: 0;
  padding-left: 0;
  width: 100%;
  font-size: clamp(22px, 2.4vw, 30px);
  font-weight: 700;
  line-height: 1.25;
  color: transparent;
  background: linear-gradient(90deg, #ffffff 0%, #9ca3af 100%);
  -webkit-background-clip: text;
  background-clip: text;
}

.delivery-book-stage__page-subtitle {
  margin: 10px 0 0;
  font-family: var(--pj-font-sans);
  font-size: 14px;
  font-weight: 400;
  line-height: 1.45;
  color: rgba(228, 228, 231, 0.72);
}

.delivery-book-stage__modules {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 48px;
  width: 100%;
}

.delivery-book-stage__module {
  position: relative;
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: min(720px, 100%);
  min-width: 0;
  padding-left: 0;
  box-sizing: border-box;
}

.delivery-book-stage__section-head {
  position: relative;
  display: flex;
  align-items: flex-start;
  gap: 16px;
  margin: 0 0 20px;
  padding: 0 0 0 28px;
}

.delivery-book-stage__section-head-text {
  min-width: 0;
  flex: 1 1 auto;
}

.delivery-book-stage__section-gloss {
  margin: 4px 0 0;
  font-size: 12px;
  line-height: 1.4;
  font-weight: 400;
  color: #9ca3af;
}

.delivery-book-stage__section-dot {
  position: absolute;
  left: 8px;
  top: 0.55em;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #fde047;
  box-shadow: 0 0 8px rgba(253, 224, 71, 0.6);
  flex-shrink: 0;
}

.delivery-book-stage__section-rail,
.delivery-book-stage__section-node,
.delivery-book-stage__section-num {
  display: none;
}

.delivery-book-stage__section-title {
  margin: 0;
  font-size: 15px;
  font-weight: 400;
  color: #ffffff;
  line-height: 1.75;
  text-shadow: none;
}

.delivery-book-stage__module:not(:first-child) .delivery-book-stage__section-title {
  color: #ffffff;
  font-size: 15px;
  font-weight: 400;
}

.delivery-book-stage__section-card {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 16px;
  width: 100%;
  min-height: 0;
  padding: 28px 32px;
  border-radius: 6px;
  background: #111827;
  border: 1px solid rgba(255, 255, 255, 0.05);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  overflow: hidden;
  transition: border-color 300ms ease;
}

.delivery-book-stage__section-card:hover {
  border-color: rgba(253, 224, 71, 0.2);
}

/* Corner accents — reference L marks */
.delivery-book-stage__section-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 16px;
  height: 16px;
  border-top: 1px solid rgba(253, 224, 71, 0.3);
  border-left: 1px solid rgba(253, 224, 71, 0.3);
  border-radius: 6px 0 0 0;
  pointer-events: none;
  background: none;
}

.delivery-book-stage__section-card::after {
  content: "";
  position: absolute;
  bottom: 0;
  right: 0;
  width: 16px;
  height: 16px;
  border-bottom: 1px solid rgba(253, 224, 71, 0.3);
  border-right: 1px solid rgba(253, 224, 71, 0.3);
  border-radius: 0 0 6px 0;
  pointer-events: none;
  background: none;
}

.delivery-book-stage__section-body {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  gap: 14px;
  flex: 1;
  color: #ffffff;
  font-size: 15px;
  font-weight: 400;
  line-height: 1.75;
}

.delivery-book-stage__rx-parts {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.delivery-book-stage__rx-part {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.delivery-book-stage__rx-label {
  font-family: var(--pj-font-sans);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ws-gold, #f2ca50);
  opacity: 0.92;
}

.delivery-book-stage__section-body.poju-delivery-v2__body,

/*
 * Header + footer share one solid paint.
 * Pixel samples of the live UI show they were already the same hex
 * (~#0e1525); the header *looks* darker because it is empty (tiny logo)
 * while the footer is packed with white icons + gold controls.
 * Fix = lift the dock color + shared top highlight so an empty strip
 * does not read as a black void.
 */
.delivery-book-stage__chrome {
  --delivery-chrome-bg: #1a2336;
  position: relative;
  z-index: 3;
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: minmax(100px, 1fr) minmax(180px, 1.5fr) minmax(120px, 1fr);
  align-items: center;
  gap: 8px;
  margin: 0;
  padding: 4px 14px;
  min-height: 44px;
  border: none;
  background: var(--delivery-chrome-bg);
  background-color: var(--delivery-chrome-bg);
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
  /* Shared lift: faint top sheen so empty header matches busy footer */
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07);
  transform: translateZ(0);
}

.delivery-book-stage__chrome--header {
  border-radius: 16px 16px 0 0;
  border-bottom: 1px solid rgba(148, 163, 184, 0.14);
}

.delivery-book-stage__chrome--footer {
  border-radius: 0 0 16px 16px;
  border-top: 1px solid rgba(148, 163, 184, 0.14);
}

.delivery-book-stage__chrome-left,
.delivery-book-stage__chrome-center,
.delivery-book-stage__chrome-right {
  display: flex;
  align-items: center;
  min-width: 0;
}

.delivery-book-stage__chrome-left {
  justify-content: flex-start;
}

.delivery-book-stage__chrome-center {
  justify-content: center;
}

.delivery-book-stage__chrome-right {
  justify-content: flex-end;
}

.delivery-book-stage__chrome-actions {
  display: flex;
  flex-wrap: nowrap;
  align-items: center;
  gap: 6px;
}

.delivery-book-stage__icon-btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  padding: 0;
  border: none;
  border-radius: 6px;
  background: transparent;
  color: #ffffff;
  cursor: pointer;
  transition: background 160ms ease;
}

.delivery-book-stage__icon-btn:hover:not(:disabled) {
  background: rgba(255, 255, 255, 0.04);
}

.delivery-book-stage__icon-btn:focus-visible {
  outline: 2px solid rgba(242, 202, 80, 0.55);
  outline-offset: 2px;
}

.delivery-book-stage__icon-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.delivery-book-stage__icon-glyph {
  display: block;
  width: 20px;
  height: 20px;
  background: #ffffff;
  mask-size: contain;
  mask-repeat: no-repeat;
  mask-position: center;
  -webkit-mask-size: contain;
  -webkit-mask-repeat: no-repeat;
  -webkit-mask-position: center;
  transition: background 160ms ease;
}

.delivery-book-stage__icon-btn:hover:not(:disabled) .delivery-book-stage__icon-glyph {
  background: var(--ws-gold, #f2ca50);
}

/* Opaque portal tip — body-mounted so shell overflow cannot clip it */
.delivery-book-stage__chrome-tip {
  position: fixed;
  z-index: 10050;
  transform: translate(-50%, -100%);
  padding: 6px 10px;
  border-radius: 8px;
  background: #0b0f12;
  border: 1px solid rgba(255, 255, 255, 0.14);
  color: #ffffff;
  font-family: var(--font-primary, Inter, sans-serif);
  font-size: 12px;
  letter-spacing: 0.02em;
  line-height: 1.3;
  white-space: nowrap;
  pointer-events: none;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
}

.delivery-book-stage__chrome-email-msg {
  font-size: 11px;
  color: var(--ws-gold, #f2ca50);
  max-width: 140px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.delivery-book-stage__audio {
  display: flex;
  align-items: center;
  gap: 10px;
  width: min(100%, 480px);
}

.delivery-book-stage__audio.is-disabled {
  opacity: 0.45;
}

.delivery-book-stage__audio-play {
  position: relative;
  flex: 0 0 auto;
  width: 32px;
  height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

/* Idle / ready: white horn. Generating: grey until stream finishes. */
.delivery-book-stage__audio-play.is-ready .delivery-book-stage__icon-glyph,
.delivery-book-stage__audio-play:not(.is-generating) .delivery-book-stage__icon-glyph {
  background: #ffffff;
}

.delivery-book-stage__audio-play.is-generating .delivery-book-stage__icon-btn:disabled {
  opacity: 1;
  cursor: wait;
}

.delivery-book-stage__audio-play.is-generating .delivery-book-stage__icon-glyph {
  background: rgba(255, 255, 255, 0.38);
}

/* Tight ring around the 20px glyph (not the full 32px hit target) */
.delivery-book-stage__audio-spin {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 22px;
  height: 22px;
  margin: -11px 0 0 -11px;
  border-radius: 50%;
  border: 1.5px solid rgba(255, 255, 255, 0.14);
  border-top-color: rgba(255, 255, 255, 0.55);
  border-right-color: rgba(242, 202, 80, 0.75);
  box-sizing: border-box;
  pointer-events: none;
  animation: delivery-audio-spin 0.85s linear infinite;
}

@media (prefers-reduced-motion: reduce) {
  .delivery-book-stage__audio-spin {
    animation: none;
    border-color: rgba(242, 202, 80, 0.65);
  }
}

@keyframes delivery-audio-spin {
  to {
    transform: rotate(360deg);
  }
}

.delivery-book-stage__audio-seek {
  flex: 1 1 auto;

  cursor: pointer;
}

.delivery-book-stage__audio-speed {

.delivery-book-stage__audio-speed:hover:not(:disabled) {
  color: var(--ws-gold, #f2ca50);
}

.delivery-book-stage__audio-speed:disabled {

}

.delivery-book-stage__audio-regen {
  min-width: 36px;

  padding: 0 8px;
  border: 1px solid rgba(255, 255, 255, 0.22);
  border-radius: 4px;
  background: transparent;
  color: rgba(255, 255, 255, 0.85);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.02em;
  cursor: pointer;
  white-space: nowrap;
  transition: color 160ms ease, border-color 160ms ease, background 160ms ease;
}

.delivery-book-stage__audio-regen:hover:not(:disabled) {
  color: var(--ws-gold, #f2ca50);
  border-color: rgba(242, 202, 80, 0.55);
  background: rgba(242, 202, 80, 0.08);
}

.delivery-book-stage__audio-regen:disabled {
  opacity: 0.45;
  cursor: default;
}

.delivery-book-stage__pager {
  display: flex;

}

.delivery-book-stage__spin {

/* Term marks — golden soft word + dotted underline; detail plain in hover/click pop */

.term-mark {
  display: inline;
  position: relative;
}

.term-mark__word,
.term-mark__info,
.term-mark__paren {
  white-space: normal;
}

.term-mark__word {
  font-weight: 500;
}

.term-mark__word--interactive {
  border-bottom: 1px dotted currentColor;
  border-bottom-color: color-mix(in srgb, currentColor 45%, transparent);
  cursor: help;
  /* Keep selectable so gold soft labels copy with surrounding evidence/body prose */
  user-select: text;
  -webkit-user-select: text;
}

/* Evidence layer: [软译] + dashed underline so adjacent gold marks stay separable */
.term-mark--bracket .term-mark__word--interactive,
.term-mark__word--bracket.term-mark__word--interactive {
  border-bottom-style: dashed;
  letter-spacing: 0.01em;
}

.term-mark--bracket + .term-mark--bracket {
  margin-left: 0.15em;
}

.term-mark__word--interactive:hover,
.term-mark__word--interactive:focus-visible {
  border-bottom-color: currentColor;
}

.term-mark__paren {
  display: inline;
  margin: 0;
  padding: 0;
  border: none;
  background: none;
  font: inherit;
  font-weight: 450;
  line-height: inherit;
  cursor: help;
  vertical-align: baseline;
  color: inherit;
}

.term-mark--neutral .term-mark__word,
.term-mark--neutral .term-mark__info,
.term-mark--neutral .term-mark__paren {
  color: #c5a880;
}

.term-mark--favorable .term-mark__word,
.term-mark--favorable .term-mark__info,
.term-mark--favorable .term-mark__paren {
  color: #7fc4a8;
}

.term-mark--caution .term-mark__word,
.term-mark--caution .term-mark__info,
.term-mark--caution .term-mark__paren {
  color: #e07a5f;
}

.term-mark--neutral .glossary-pop__title {
  color: #c5a880;
}

.term-mark--favorable .glossary-pop__title {
  color: #7fc4a8;
}

.term-mark--caution .glossary-pop__title {
  color: #e07a5f;
}

/* legacy default gold when no polarity class */
.term-mark:not([class*="term-mark--"]) .term-mark__word,
.term-mark:not([class*="term-mark--"]) .term-mark__info,
.term-mark:not([class*="term-mark--"]) .term-mark__paren {
  color: #d4af37;
}

.term-mark--hover {
  cursor: help;
}

/* Matrix/zodiac hover mode: same dotted underline language */
.term-mark--hover .term-mark__word {
  border-bottom: 1px dotted currentColor;
  border-bottom-color: color-mix(in srgb, currentColor 45%, transparent);
}

.term-mark--hover .term-mark__word--interactive:hover,
.term-mark--hover .term-mark__word--interactive:focus-visible,
.term-mark--hover:hover .term-mark__word,
.term-mark--hover:focus-within .term-mark__word {
  border-bottom-color: currentColor;
}

/* Legacy .term-mark__info ([···] opener) kept for old CSS refs; TermMark uses soft word + underline */
.term-mark__info {
  display: inline;
  margin-left: 2px;
  padding: 0 1px;
  border: none;
  background: none;
  font-size: 0.82em;
  line-height: 1;

}

.term-mark__info--inline {

}

.term-hint {

  border: 0.5px solid rgba(212, 175, 55, 0.25);

}

.term-hint--bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  margin: 0;
  padding: 0.75rem 1rem;
  border-radius: 0.625rem;
  background: rgba(212, 175, 55, 0.1);
  border: 1px solid rgba(212, 175, 55, 0.28);
}

.term-hint__body {

}

.term-hint__dismiss {
  flex-shrink: 0;

  padding: 0.25rem 0.75rem;
  border: 1px solid rgba(212, 175, 55, 0.45);
  border-radius: 999px;
  background: rgba(212, 175, 55, 0.12);
  color: #d4af37;
  cursor: pointer;
  font: inherit;
  font-size: 0.8125rem;
  white-space: nowrap;
  text-decoration: none;
}

/* Legacy glossary popover (shared with term marks) */
.glossary-mark {
  color: #d4af37;
  font-weight: 500;
  cursor: help;
  position: relative;
}

.glossary-pop {
  position: absolute;
  left: 0;
  top: 1.6em;
  z-index: 1000;
  box-sizing: border-box;
  width: min(280px, 78vw);
  max-width: min(280px, 78vw);
  padding: 12px 14px;
  border-radius: 14px;
  background: rgba(20, 18, 32, 0.92);
  box-shadow:
    inset 0 0 0 0.5px rgba(255, 255, 255, 0.08),
    0 12px 40px rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(20px);
  font-size: 13px;
  line-height: 1.5;
  display: grid;
  gap: 4px;
  white-space: normal;
  overflow-wrap: break-word;
  word-break: break-word;
  pointer-events: auto;
}

/* Portaled popover — escapes modal overflow clipping */
.glossary-pop--portal {
  position: fixed;
  top: auto;
  left: auto;
}

.glossary-pop--portal.glossary-pop--above {
  transform: translateY(-100%);
}

.glossary-pop__title {
  color: #d4af37;
  font-weight: 600;
  white-space: normal;
  overflow-wrap: break-word;
}

.glossary-pop__body {
  color: #cbd0e0;
  white-space: normal;
  overflow-wrap: break-word;
}

.streaming-analysis-panel .glossary-pop {
  top: auto;
  bottom: 1.6em;
}

.term-mark .glossary-pop {
  top: 1.6em;
}

.streaming-analysis-panel .term-mark .glossary-pop {
  top: auto;
  bottom: 1.6em;
}

.evidence-block {
  margin: 0.85rem 0 1.1rem;
  border-left: 2px solid color-mix(in srgb, var(--pj-gold, #d4a574) 45%, transparent);
  padding-left: 0.75rem;
}

.evidence-block__toggle {
  display: inline-flex;
  align-items: center;
  gap: 0.2rem;
  padding: 0.2rem 0;
  margin: 0;
  border: 0;
  background: transparent;
  color: var(--pj-gold-soft, #c5a880);
  font: inherit;
  font-size: 0.95em;
  font-weight: 500;
  letter-spacing: 0.01em;
  cursor: pointer;
  text-align: left;
}

.evidence-block__toggle:hover,
.evidence-block__toggle:focus-visible {
  color: var(--pj-gold, #d4a574);
  outline: none;
}

.evidence-block__chevron {
  display: inline-block;
  width: 1em;
  font-weight: 700;
  line-height: 1;
  color: inherit;
}

.evidence-block__play {
  font-size: 16px;
  line-height: 1;
  font-variation-settings: "FILL" 1, "wght" 400, "GRAD" 0, "opsz" 20;
  transition: transform 200ms ease;
}

.evidence-block--open .evidence-block__play {
  /* expand_more already points down; keep stable */
  transform: none;
}

@media (prefers-reduced-motion: reduce) {
  .evidence-block__play {
    transition: none;
  }
}

.evidence-block__label {
  color: inherit;
  border-bottom: 1px dotted color-mix(in srgb, currentColor 45%, transparent);
}

.evidence-block--open .evidence-block__label {
  border-bottom-color: transparent;
}

.evidence-block__toggle:hover .evidence-block__label,
.evidence-block__toggle:focus-visible .evidence-block__label {
  border-bottom-color: currentColor;
}

.evidence-block__panel {
  margin-top: 0.55rem;
  padding: 0.15rem 0 0.25rem;
  color: color-mix(in srgb, var(--text-body, #2a2a2a) 88%, transparent);
  font-size: 0.95em;
  line-height: 1.55;
}

.evidence-block__panel[hidden] {
  display: none;
}

.evidence-block__panel .reading-p {
  margin: 0.35rem 0 0;
}

</style>

<script>

(function(){
  var panes = Array.prototype.slice.call(document.querySelectorAll("[data-slot-pane]"));
  var buttons = Array.prototype.slice.call(document.querySelectorAll("[data-slot]"));
  var label = document.getElementById("dib-page-label");
  var prev = document.getElementById("dib-prev");
  var next = document.getElementById("dib-next");
  if (!panes.length) return;
  var ids = panes.map(function(p){ return p.getAttribute("data-slot-pane"); });
  function indexOf(id){ var i = ids.indexOf(id); return i < 0 ? 0 : i; }
  function show(id){
    var idx = indexOf(id); id = ids[idx];
    panes.forEach(function(p){ var on = p.getAttribute("data-slot-pane") === id; p.classList.toggle("is-active", on); p.hidden = !on; });
    buttons.forEach(function(b){ var on = b.getAttribute("data-slot") === id; b.classList.toggle("is-active", on); b.classList.toggle("delivery-book-stage__toc-item--active", on); b.classList.toggle("delivery-book-stage__toc-item--ready", !on); });
    if (label) label.textContent = (idx + 1) + " / " + ids.length;
    if (prev) prev.disabled = idx <= 0;
    if (next) next.disabled = idx >= ids.length - 1;
    try { if (history.replaceState) history.replaceState(null, "", "#" + encodeURIComponent(id)); } catch (e) {}
    var active = panes[idx]; if (active) active.scrollTop = 0;
  }
  buttons.forEach(function(b){ b.addEventListener("click", function(){ var id = b.getAttribute("data-slot"); if (id) show(id); }); });
  if (prev) prev.addEventListener("click", function(){ var cur = panes.findIndex(function(p){ return p.classList.contains("is-active"); }); if (cur > 0) show(ids[cur - 1]); });
  if (next) next.addEventListener("click", function(){ var cur = panes.findIndex(function(p){ return p.classList.contains("is-active"); }); if (cur >= 0 && cur < ids.length - 1) show(ids[cur + 1]); });
  var hash = (location.hash || "").replace(/^#/, "");
  var start = hash ? decodeURIComponent(hash) : ids[0];
  if (ids.indexOf(start) < 0) start = ids[0];
  show(start);
  document.querySelectorAll(".evidence-block__toggle").forEach(function(btn){
    btn.addEventListener("click", function(){
      var root = btn.closest(".evidence-block");
      if (!root) return;
      var panel = root.querySelector(".evidence-block__panel");
      var open = root.classList.toggle("evidence-block--open");
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      if (panel) panel.hidden = !open;
      var chev = btn.querySelector(".evidence-block__chevron");
      if (chev) chev.textContent = open ? "\u25BE" : "\u25B8";
    });
  });
  var closeBtn = document.getElementById("eos-decision-close");
  if (closeBtn) closeBtn.addEventListener("click", function(){
    try { if (window.parent && window.parent !== window) { window.parent.postMessage({ type: "eastern-os-decision-close" }, "*"); return; } } catch (e) {}
    try { window.close(); } catch (e2) {}
  });
  var pop = null;
  function hidePop(){ if (pop) { pop.remove(); pop = null; } }
  document.addEventListener("mouseover", function(ev){
    var t = ev.target; if (!t || !t.closest) return;
    var el = t.closest("[data-gloss]"); if (!el) return;
    hidePop();
    var text = el.getAttribute("data-gloss") || el.getAttribute("title") || "";
    if (!text) return;
    pop = document.createElement("div"); pop.className = "eos-gloss-pop"; pop.textContent = text;
    document.body.appendChild(pop);
    var r = el.getBoundingClientRect();
    var top = r.bottom + 8; if (top + pop.offsetHeight > window.innerHeight - 8) top = r.top - pop.offsetHeight - 8;
    var left = Math.min(Math.max(8, r.left), window.innerWidth - pop.offsetWidth - 8);
    pop.style.top = top + "px"; pop.style.left = left + "px";
  });
  document.addEventListener("mouseout", function(ev){
    var t = ev.target; if (!t || !t.closest) return;
    if (t.closest("[data-gloss]")) hidePop();
  });
})();

</script>
