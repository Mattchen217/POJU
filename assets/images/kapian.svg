import { Canvas, useFrame } from '@react-three/fiber';
import { Points, PointMaterial } from '@react-three/drei';
import { useRef, useMemo } from 'react';
import * as THREE from 'three';

function ParticleSwirl({ color='#9d6bff', type='spiral' }: {color?:string; type?:string}) {
  const ref = useRef<any>(null);
  const positions = useMemo(() => {
    const arr = new Float32Array(6000);
    for (let i=0;i<2000;i++) {
      const p=i/2000; let x=0,y=0,z=(Math.random()-0.5)*3;
      if(type==='eye'){ const a=p*Math.PI*2; x=Math.cos(a)*8; y=Math.sin(a)*3; }
      else if(type==='water'){ const a=p*20; x=(p-0.5)*16; y=Math.sin(a)*2; }
      else if(type==='sky'){ const a=p*Math.PI*2; x=Math.cos(a)*p*8; y=Math.sin(a)*p*8; }
      else if(type==='tailwind'){ const a=p*Math.PI*5; x=Math.cos(a)*p*7; y=Math.sin(a)*p*5; }
      else { const a=p*Math.PI*8; x=Math.cos(a)*p*8; y=Math.sin(a)*p*8; }
      arr[i*3]=x; arr[i*3+1]=y; arr[i*3+2]=z;
    }
    return arr;
  },[type]);
  useFrame((state,d)=>{ if(ref.current){ ref.current.rotation.z += d*0.12; ref.current.rotation.y = Math.sin(state.clock.elapsedTime*0.3)*0.08; }});
  return <Points ref={ref} positions={positions} stride={3} frustumCulled>
    <PointMaterial transparent color={color} size={0.18} sizeAttenuation depthWrite={false} blending={THREE.AdditiveBlending} />
  </Points>;
}

function R3FCard({title,color,type}:{title:string;color:string;type:string}){
 return <div className="relative w-full aspect-[9/16] rounded-[24px] overflow-hidden bg-black border border-white/10">
   <Canvas orthographic camera={{zoom:55, position:[0,0,100]}}>
    <color attach="background" args={['#05060a']} />
    <ambientLight intensity={0.7}/>
    <pointLight position={[0,0,10]} intensity={2} color={color}/>
    <ParticleSwirl color={color} type={type}/>
    <mesh position={[0,0,-2]}>
      <planeGeometry args={[30,52]} />
      <meshBasicMaterial color={color} transparent opacity={0.05} />
    </mesh>
   </Canvas>
   <div className="absolute bottom-8 inset-x-0 text-center text-white tracking-[0.25em] text-sm font-light drop-shadow-xl">{title}</div>
 </div>
}

export default function OracleGrid(){return <div className="grid grid-cols-1 md:grid-cols-3 gap-6 p-6 bg-[#05060a]"> <R3FCard title="DIVINE TAILWIND" color="#f6c453" type="tailwind"/> <R3FCard title="FAIR SKY" color="#52a8ff" type="sky"/> <R3FCard title="STILL WATER" color="#3df0e6" type="water"/> <R3FCard title="CROSSWIND" color="#9d6bff" type="spiral"/> <R3FCard title="EYE OF STORM" color="#ff5577" type="eye"/> </div>}
