import React from 'react';

const Card = ({title, subtitle, colors, children}:{title:string; subtitle:string; colors:[string,string]; children:React.ReactNode}) => (
  <div className="relative w-full aspect-[9/16] rounded-[24px] overflow-hidden bg-black border border-white/10 shadow-2xl">
    <svg viewBox="0 0 900 1600" className="w-full h-full">
      <defs>
        <linearGradient id={`bg-${title}`} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#06070d"/>
          <stop offset="100%" stopColor="#0d1020"/>
        </linearGradient>
        <radialGradient id={`glow-${title}`}>
          <stop offset="0%" stopColor={colors[0]} stopOpacity="0.9"/>
          <stop offset="100%" stopColor={colors[1]} stopOpacity="0"/>
        </radialGradient>
        <filter id={`blur-${title}`}><feGaussianBlur stdDeviation="8"/></filter>
      </defs>
      <rect width="900" height="1600" fill={`url(#bg-${title})`} rx="40"/>
      <rect x="18" y="18" width="864" height="1564" rx="34" fill="none" stroke={colors[0]} opacity="0.45"/>
      <circle cx="450" cy="560" r="280" fill={`url(#glow-${title})`} filter={`url(#blur-${title})`} />
      {children}
      <text x="450" y="1320" textAnchor="middle" fill={colors[0]} fontSize="64" fontFamily="serif">{title}</text>
      <text x="450" y="1390" textAnchor="middle" fill="#d1d5db" fontSize="30">{subtitle}</text>
    </svg>
  </div>
);

